# Pipeline de Integracao Continua (CI) do CondoConecta
# Referenciado na secao 5 do PGCS.
#
# Executa em pull requests para a main e manualmente (workflow_dispatch).

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: backend

      - name: Testes unitarios (Jest)
        run: npm test
        working-directory: backend
